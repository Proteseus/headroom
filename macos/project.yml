name: Headroom
options:
  bundleIdPrefix: com.centaur-labs
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # MARKETING_VERSION / CURRENT_PROJECT_VERSION / DEVELOPMENT_TEAM live only
    # in Version.xcconfig, written by scripts/version-env.sh. Setting them here
    # would override the xcconfig and freeze builds at 1; hardcoding the team
    # would stop forks from signing as themselves ($HEADROOM_TEAM_ID).
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
targets:
  Headroom:
    type: application
    platform: macOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: Sources
      - path: ../Shared
      - path: Assets.xcassets
      # Bundled Python host → Contents/Resources/host/
      - path: host
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.headroom.macos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Headroom
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Headroom.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../scripts/version-env.sh" --write-xcconfig'
    postCompileScripts:
      - name: Stamp Apple version
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../scripts/version-env.sh" --stamp-product'
    scheme:
      testTargets:
        - HeadroomTests
  HeadroomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        # Without this the test bundle can't code sign, so `xcodebuild test`
        # fails before running anything.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.headroom.macos.tests
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Headroom
  HeadroomMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: ../ios/HeadroomMobile
        excludes:
          - Info.plist
          - HeadroomMobile.entitlements
      - path: ../Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.headroom
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../ios/HeadroomMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: ../ios/HeadroomMobile/HeadroomMobile.entitlements
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../scripts/version-env.sh" --write-xcconfig'
    # Do not stamp the widget target alone — that made appex=37 while app=1.
    # Versions come from Version.xcconfig for both; parent can re-stamp the
    # whole .app tree if needed after compile.
    postCompileScripts:
      - name: Stamp Apple version
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../scripts/version-env.sh" --stamp-product'
    dependencies:
      - target: HeadroomWidget
        embed: true
    scheme:
      testTargets:
        - HeadroomMobileTests
  HeadroomWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: ../ios/HeadroomWidget
        excludes:
          - Info.plist
          - HeadroomWidget.entitlements
      - path: ../Shared/WidgetSnapshot.swift
      - path: ../Shared/HeadroomRings.swift
      - path: ../Shared/HeadroomCopy.swift
      # Palette only — it is deliberately free of the model layer so the
      # widget can tint rings without compiling HeadroomModels.swift.
      - path: ../Shared/HeadroomPalette.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.headroom.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../ios/HeadroomWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../ios/HeadroomWidget/HeadroomWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
  HeadroomMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../ios/HeadroomMobileTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.headroom.tests
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: HeadroomMobile
