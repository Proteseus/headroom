name: HeadroomBar
options:
  bundleIdPrefix: com.mz
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  HeadroomBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Bundled Python host → Contents/Resources/host/
      - path: host
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mz.headroom-bar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Headroom
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - HeadroomBarTests
  HeadroomBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        # Without this the test bundle can't code sign, so `xcodebuild test`
        # fails before running anything.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mz.headroom-bar.tests
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: HeadroomBar
  HeadroomMobile:
    type: application
    platform: iOS
    sources:
      - path: ../ios/HeadroomMobile
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mz.headroom
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../ios/HeadroomMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - HeadroomMobileTests
  HeadroomMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../ios/HeadroomMobileTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mz.headroom.tests
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: HeadroomMobile
