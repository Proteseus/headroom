name: Release

on:
  push:
    # A bump to host/VERSION on main releases itself — see the `gate` job. The
    # tag path stays for hand-cut releases (scripts/cut-release.sh).
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize:
        description: "Notarize macOS zip (requires signing secrets)"
        type: boolean
        default: true
      upload_testflight:
        description: "Upload iOS IPA to TestFlight (requires ASC app + secrets)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Decides whether this run publishes, and under which tag. Everything else
  # keys off its outputs rather than github.ref, because on the automatic path
  # the ref is refs/heads/main and the tag does not exist yet.
  #
  # The tag is deliberately NOT pushed from here: a tag pushed with
  # GITHUB_TOKEN does not trigger workflows, so it would never reach the jobs
  # below. Instead the Create GitHub Release step takes tag_name and creates
  # the tag as it publishes, inside this same run.
  gate:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          source ./scripts/version-env.sh
          VERSION="$HEADROOM_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # build   = compile and upload artifacts
          # release = also publish a GitHub Release under $tag
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "Manual run — building $VERSION, artifacts only."
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "tag=" >> "$GITHUB_OUTPUT"
              ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                echo "Tag ${GITHUB_REF_NAME} — publishing."
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "release=true" >> "$GITHUB_OUTPUT"
                echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
                echo "v$VERSION already tagged — nothing to release."
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "release=false" >> "$GITHUB_OUTPUT"
                echo "tag=" >> "$GITHUB_OUTPUT"
              else
                # Fail loudly rather than ship an undocumented version. Nobody
                # is watching a terminal on this path.
                ./scripts/changelog-section.sh "$VERSION" >/dev/null
                echo "host/VERSION is $VERSION with no tag — releasing v$VERSION."
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "release=true" >> "$GITHUB_OUTPUT"
                echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac
  macos-app:
    name: Build Headroom.app
    runs-on: macos-latest
    needs: gate
    if: needs.gate.outputs.build == 'true'
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      notarized: ${{ steps.meta.outputs.notarized }}
      testflight_url: ${{ steps.links.outputs.testflight_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git rev-list --count matches every machine.
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        id: ver
        run: |
          source ./scripts/version-env.sh
          echo "version=$HEADROOM_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$HEADROOM_BUILD" >> "$GITHUB_OUTPUT"
          echo "Headroom $HEADROOM_VERSION+$HEADROOM_BUILD"

      - name: Check tag matches host/VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          source ./scripts/version-env.sh
          if [[ "$TAG" != "$HEADROOM_VERSION" ]]; then
            echo "error: tag v$TAG does not match host/VERSION ($HEADROOM_VERSION)" >&2
            exit 1
          fi

      - name: Read install links
        id: links
        run: |
          TF="$(./scripts/testflight-url.sh || true)"
          echo "testflight_url=$TF" >> "$GITHUB_OUTPUT"
          if [[ -n "$TF" ]]; then
            echo "TestFlight URL: $TF"
          else
            echo "No TestFlight URL in docs/install-links.md yet."
          fi

      - name: Import Developer ID certificate
        id: cert
        # Always attempt on tags; on manual runs only when notarize is checked.
        # Secrets are read in the step (not in `if:`) so missing secrets soft-fall back.
        if: github.event_name == 'push' || inputs.notarize
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${MACOS_CERTIFICATE_P12:-}" || -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "imported=false" >> "$GITHUB_OUTPUT"
            echo "No MACOS_CERTIFICATE_P12 / PASSWORD — ad-hoc build."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/headroom.keychain-db"
          # macOS runners use BSD base64 — write via stdout, not GNU -o.
          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "${KEYCHAIN_PASSWORD:-headroom-ci}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD:-headroom-ci}" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "${KEYCHAIN_PASSWORD:-headroom-ci}" "$KEYCHAIN_PATH" || true
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' \
            | head -1)
          if [[ -z "$IDENTITY" ]]; then
            echo "imported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Developer ID identity missing after import — falling back to ad-hoc."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 0
          fi
          echo "HEADROOM_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "imported=true" >> "$GITHUB_OUTPUT"
          echo "Using identity: $IDENTITY"

      - name: Build + notarize
        id: notarize
        if: steps.cert.outputs.imported == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER_ID:-}" ]]; then
            echo "error: cert imported but APPLE_API_KEY / KEY_ID / ISSUER_ID missing (see docs/releasing.md)" >&2
            exit 1
          fi
          ./scripts/build-app.sh --release --notarize
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Build (ad-hoc fallback)
        id: adhoc
        if: steps.cert.outputs.imported != 'true'
        run: |
          echo "::warning::Signing secrets missing — shipping ad-hoc signed zip (Gatekeeper will warn)."
          ./scripts/build-app.sh --release
          echo "notarized=false" >> "$GITHUB_OUTPUT"

      - name: Record signing meta
        id: meta
        run: |
          if [[ "${{ steps.notarize.outputs.notarized }}" == "true" ]]; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headroom-macOS
          path: |
            dist/Headroom.app
            dist/Headroom-macOS.zip
            dist/version.txt

      - name: Compose release notes
        id: notes
        if: needs.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          NOTARIZED: ${{ steps.meta.outputs.notarized }}
          TESTFLIGHT_URL: ${{ steps.links.outputs.testflight_url }}
          TAG: ${{ needs.gate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "Headroom **${VERSION}** (build ${BUILD})."
            echo
            echo "## What changed"
            echo
            ./scripts/changelog-section.sh "$VERSION"
            echo
            echo "## macOS"
            echo
            echo "Download [\`Headroom-macOS.zip\`](https://github.com/${REPO}/releases/download/${TAG}/Headroom-macOS.zip), unzip, open \`Headroom.app\`."
            echo
            if [[ "$NOTARIZED" == "true" ]]; then
              echo "Notarized — Gatekeeper should accept it on first open."
            else
              echo "Ad-hoc signed — right-click → Open the first time (signing secrets not configured; see \`docs/releasing.md\`)."
            fi
            echo
            echo "On first launch the Welcome sheet **starts the bundled host** automatically. Confirm Claude / Codex / Cursor, then Continue."
            echo
            echo "## iPhone"
            echo
            if [[ -n "${TESTFLIGHT_URL:-}" ]]; then
              echo "Install via [TestFlight](${TESTFLIGHT_URL})."
            else
              echo "No public TestFlight link in \`docs/install-links.md\` yet — build from source ([docs/ios-companion.md](https://github.com/${REPO}/blob/${TAG}/docs/ios-companion.md)) or wait for an invite."
            fi
            echo
            echo "Pairing uses the **mobile token** (Mac Settings → **Copy mobile token**), not the host token used by the ESP32."
          } > "$RUNNER_TEMP/release-body.md"
          echo "path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: needs.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Explicit tag_name so this works on the automatic path, where the
          # ref is a branch. The action creates the tag at this commit when it
          # does not exist yet, which is what replaces cut-release.sh.
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Headroom-macOS.zip
            dist/version.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}

  ios-testflight:
    name: iOS → TestFlight
    runs-on: macos-latest
    needs: [gate, macos-app]
    # Releasing: soft-attempt when ASC secrets exist. Manual: only when checked.
    if: |
      always() &&
      needs.macos-app.result == 'success' &&
      (
        needs.gate.outputs.release == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.upload_testflight)
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check App Store Connect secrets
        id: asc
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          if [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER_ID:-}" || -z "${ASC_APP_ID:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "Add ASC API + ASC_APP_ID secrets (see docs/releasing.md), then re-run." >&2
              exit 1
            fi
            echo "::warning::ASC secrets missing — skipping TestFlight upload on this tag."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen + asc
        if: steps.asc.outputs.ready == 'true'
        run: brew install xcodegen asc

      - name: Resolve version
        if: steps.asc.outputs.ready == 'true'
        run: |
          source ./scripts/version-env.sh
          echo "Headroom iOS $HEADROOM_VERSION+$HEADROOM_BUILD"

      # Cloud signing can create *development* certificates from an API key and
      # nothing more — Apple does not let a key mint an Apple Distribution one.
      # Without this the export asks for a distribution identity the runner has
      # never had, and fails with "Cloud signing permission error". Every such
      # run also leaves another "Created via API" development cert behind,
      # against the team's cap. Import the real identity instead.
      - name: Import Apple Distribution certificate
        id: ioscert
        if: steps.asc.outputs.ready == 'true'
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${IOS_DISTRIBUTION_P12:-}" || -z "${IOS_DISTRIBUTION_PASSWORD:-}" ]]; then
            echo "error: IOS_DISTRIBUTION_P12 / _PASSWORD missing — export cannot sign" >&2
            echo "       (see docs/releasing.md, 'TestFlight is a second, local step')" >&2
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/headroom-ios.keychain-db"
          echo -n "$IOS_DISTRIBUTION_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "${KEYCHAIN_PASSWORD:-headroom-ci}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD:-headroom-ci}" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_PASSWORD" \
            -A -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "${KEYCHAIN_PASSWORD:-headroom-ci}" "$KEYCHAIN_PATH" || true
          # A p12 missing either half imports silently (see docs/releasing.md).
          # Fail here rather than let export report a confusing signing error.
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep -q "Apple Distribution"; then
            echo "error: no Apple Distribution identity after import — the p12 is" >&2
            echo "       missing its certificate or its private key" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution"

      # Automatic signing wants Xcode-managed profiles, which only a signed-in
      # Xcode account can mint — the runner has none, and an API key cannot
      # make them. Fetch the named App Store profiles instead and export
      # against those. Names must match scripts/build-ios.sh.
      - name: Install App Store provisioning profiles
        if: steps.asc.outputs.ready == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$KEY_PATH"
          export ASC_KEY_ID="$APPLE_API_KEY_ID"
          export ASC_ISSUER_ID="$APPLE_API_ISSUER_ID"
          export ASC_PRIVATE_KEY_PATH="$KEY_PATH"
          export ASC_BYPASS_KEYCHAIN=true
          # Both locations: older Xcode reads MobileDevice, 15+ reads UserData.
          DEST_A="$HOME/Library/MobileDevice/Provisioning Profiles"
          DEST_B="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$DEST_A" "$DEST_B"
          NAMES=(
            "Headroom App Store"
            "Headroom Widget App Store"
            "Headroom Watch App Store"
            "Headroom Watch Complication App Store"
          )
          LIST="$(asc profiles list --limit 200 --output json)"
          for name in "${NAMES[@]}"; do
            id=$(jq -r --arg n "$name" \
              '.data[] | select(.attributes.name == $n
                                and .attributes.profileState == "ACTIVE") | .id' \
              <<<"$LIST" | head -1)
            if [[ -z "$id" ]]; then
              echo "error: no ACTIVE profile named '$name' in App Store Connect" >&2
              echo "       create it, or fix the name in scripts/build-ios.sh" >&2
              exit 1
            fi
            asc profiles download --id "$id" --output "$DEST_A/$id.mobileprovision" >/dev/null
            cp "$DEST_A/$id.mobileprovision" "$DEST_B/$id.mobileprovision"
            echo "installed $name ($id)"
          done
          rm -f "$KEY_PATH"

      - name: Build IPA + publish TestFlight
        if: steps.asc.outputs.ready == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_TESTFLIGHT_GROUP: ${{ secrets.ASC_TESTFLIGHT_GROUP }}
        run: ./scripts/build-ios.sh --upload --manual-signing

      - name: Upload IPA artifact
        if: steps.asc.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Headroom-iOS
          path: |
            dist/Headroom-iOS.ipa
            dist/ios-version.txt

      - name: Attach IPA to GitHub Release
        if: steps.asc.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Headroom-iOS.ipa
          fail_on_unmatched_files: true
