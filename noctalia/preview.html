<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #1a1a2e; font-family: 'Inter', system-ui, sans-serif; color: #e8e8ec; margin: 0; padding: 40px; display: flex; flex-direction: column; gap: 48px; align-items: center; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: #8888a0; margin-bottom: 16px; }
  .section { width: 640px; }

  /* bar strip */
  .bar { background: #23233a; border-radius: 12px; padding: 8px 14px; display: flex; align-items: center; gap: 10px; width: fit-content; }
  .bar .widget { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.04); padding: 4px 8px; border-radius: 8px; }
  .bar .spacer { flex: 1; min-width: 140px; opacity: 0.25; }
  .status-pip { width: 6px; height: 6px; border-radius: 3px; }

  /* panel */
  .panel { background: #1e1e33; border: 1px solid #2e2e4a; border-radius: 16px; width: 360px; padding: 16px; box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
  .panel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .panel-header .title { font-size: 15px; font-weight: 600; flex: 1; }
  .panel-header .status { font-size: 10px; color: #9999b0; }
  .ring-grid { display: flex; gap: 18px; margin-bottom: 14px; }
  .ring-cell { flex: 1; text-align: center; }
  .ring-cell .name { font-size: 10px; font-weight: 500; margin-top: 6px; }
  .ring-cell .pct { font-size: 9px; color: #9999b0; margin-top: 2px; }
  .burn { background: rgba(255,255,255,0.05); border-radius: 8px; height: 64px; display: flex; align-items: flex-end; gap: 3px; padding: 8px; }
  .burn .day { flex: 1; display: flex; align-items: flex-end; gap: 1px; }
  .burn .day div { width: 100%; }
  .panel-footer { display: flex; justify-content: space-between; margin-top: 10px; font-size: 9px; color: #77778f; }
</style>
</head>
<body>

<!-- BAR STRIP -->
<div class="section">
  <div class="section-title">Noctalia bar — Headroom widget (3 focus providers, healthy)</div>
  <div class="bar">
    <div class="widget" id="barWidget">
      <canvas id="barCanvas" width="76" height="28"></canvas>
      <div class="status-pip" id="barPip" style="background:#5F9B73;"></div>
    </div>
    <div class="spacer">clock · wifi · tray</div>
  </div>
</div>

<!-- PANEL -->
<div class="section">
  <div class="section-title">Click-through panel — rings grid + daily burn</div>
  <div class="panel">
    <div class="panel-header">
      <span class="title">Headroom</span>
      <div class="status-pip" style="background:#5F9B73;"></div>
      <span class="status">3 quota sources — all clear</span>
    </div>
    <div class="ring-grid" id="ringGrid"></div>
    <div class="burn" id="burnChart"></div>
    <div class="panel-footer"><span>just now</span><span>Claude 42% used · Codex 58% used · Cursor 25% used</span></div>
  </div>
</div>

<!-- WARNING STATE -->
<div class="section">
  <div class="section-title">Attention states — warn / critical / host down</div>
  <div style="display:flex; gap:24px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <canvas id="warnRing" width="28" height="28"></canvas>
      <span style="font-size:11px; color:#9999b0;">warn</span>
      <div class="status-pip" style="background:#C39B55;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <canvas id="critRing" width="28" height="28"></canvas>
      <span style="font-size:11px; color:#9999b0;">critical</span>
      <div class="status-pip" style="background:#AF6964;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <canvas id="emptyRing" width="28" height="28"></canvas>
      <span style="font-size:11px; color:#9999b0;">no reading</span>
      <div class="status-pip" style="background:#C39B55;"></div>
    </div>
  </div>
</div>

<script>
// ===== HeadroomRing port (from HeadroomRing.qml / HeadroomRings.swift) =====
// palette: HeadroomPalette firmware triples
const PALETTE = {
  claude: '#D97757', codex: '#10A37F', cursor: '#789BC8', dim: '#78746E'
};

function drawRing(canvas, layers, tint, diameter, indicatorColor) {
  const ctx = canvas.getContext('2d');
  const scale = window.devicePixelRatio || 1;
  canvas.width = diameter * 2;
  canvas.height = diameter * 2;
  ctx.scale(2, 2);
  ctx.clearRect(0, 0, diameter, diameter);

  const side = diameter;
  const lineWidth = Math.max(3, side * 7 / 72);
  const spacing = Math.max(2, side * 4 / 72);
  const center = side / 2;
  let radius = side / 2 - lineWidth / 2 - 1;

  const parse = c => {
    const h = c.replace('#', '');
    return { r: parseInt(h.substr(0,2),16)/255, g: parseInt(h.substr(2,2),16)/255, b: parseInt(h.substr(4,2),16)/255 };
  };
  const tintRGB = parse(tint);
  const indRGB = parse(indicatorColor || '#e8e8ec');

  if (!layers || layers.length === 0) {
    // empty band: track only
    ctx.beginPath(); ctx.arc(center, center, radius, 0, Math.PI*2);
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = `rgba(${tintRGB.r*255|0},${tintRGB.g*255|0},${tintRGB.b*255|0},0.20)`;
    ctx.stroke();
    return;
  }

  for (const layer of layers) {
    if (radius <= lineWidth) break;
    // track
    ctx.beginPath(); ctx.arc(center, center, radius, 0, Math.PI*2);
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = `rgba(${tintRGB.r*255|0},${tintRGB.g*255|0},${tintRGB.b*255|0},0.20)`;
    ctx.stroke();
    // usage arc
    if (layer.percent !== null && layer.percent !== undefined) {
      const clamped = Math.max(0, Math.min(layer.percent, 100));
      let sweep = clamped * 3.6;
      if (clamped > 0) sweep = Math.max(sweep, 2);
      const cap = lineWidth / 2 / radius * 180 / Math.PI;
      if (cap * 2 < sweep) {
        ctx.beginPath();
        ctx.arc(center, center, radius, (-90+cap)*Math.PI/180, (-90+sweep-cap)*Math.PI/180, false);
        ctx.lineWidth = lineWidth; ctx.lineCap = 'round';
        ctx.strokeStyle = tint;
        ctx.stroke();
      } else if (sweep > 0) {
        const a = (-90 + sweep/2) * Math.PI/180;
        ctx.beginPath(); ctx.arc(center + Math.cos(a)*radius, center + Math.sin(a)*radius, lineWidth/2, 0, Math.PI*2);
        ctx.fillStyle = tint; ctx.fill();
      }
    }
    // pace dot
    if (layer.pacePercent !== null && layer.pacePercent !== undefined) {
      const a = (-90 + Math.max(0, Math.min(layer.pacePercent, 100)) * 3.6) * Math.PI/180;
      const d = Math.max(2, lineWidth * 5/7);
      ctx.beginPath();
      ctx.arc(center + Math.cos(a)*radius, center + Math.sin(a)*radius, d/2, 0, Math.PI*2);
      ctx.fillStyle = indicatorColor || '#e8e8ec';
      ctx.fill();
    }
    radius -= lineWidth + spacing;
  }
}

// ===== data =====
const providers = [
  { id: 'claude', title: 'Claude', accent: '#D97757', pools: {
    week: { title: 'Weekly', rank: 0, pct: 42, pacePct: 38 },
    session: { title: 'Session', rank: 1, pct: 55, pacePct: 60 } } },
  { id: 'codex', title: 'Codex', accent: '#10A37F', pools: {
    week: { title: 'Weekly', rank: 0, pct: 58, pacePct: 50 },
    session: { title: 'Session', rank: 1, pct: 30, pacePct: 40 } } },
  { id: 'cursor', title: 'Cursor', accent: '#789BC8', pools: {
    total: { title: 'Total', rank: 0, pct: 25, pacePct: 20 } } }
];

function layersFor(p) {
  const pools = p.pools || {};
  const ids = Object.keys(pools).sort((a, b) =>
    (pools[a].rank ?? 999) - (pools[b].rank ?? 999) || (a < b ? -1 : 1));
  return ids.filter(id => pools[id].ring !== false && pools[id].pct != null)
    .slice(0, 2)
    .map(id => ({ id, name: pools[id].title || id, percent: pools[id].pct, pacePercent: pools[id].pacePct }));
}

// ===== bar widget: one ring per focus provider + status pip =====
{
  const c = document.getElementById('barCanvas');
  // draw 3 mini rings inline
  const ctx = c.getContext('2d');
  const scale = window.devicePixelRatio || 1;
  c.width = 76 * 2; c.height = 28 * 2;
  ctx.scale(2, 2);
  const ringD = 20;
  providers.forEach((p, i) => {
    const cell = document.createElement('canvas');
    drawRing(cell, layersFor(p), p.accent, ringD, '#e8e8ec');
    ctx.drawImage(cell, 4 + i * 26, 4, ringD, ringD);
  });
}

// ===== panel: rings grid =====
{
  const grid = document.getElementById('ringGrid');
  providers.forEach(p => {
    const cell = document.createElement('div');
    cell.className = 'ring-cell';
    const cv = document.createElement('canvas');
    cv.style.width = '56px'; cv.style.height = '56px';
    drawRing(cv, layersFor(p), p.accent, 56, '#e8e8ec');
    const name = document.createElement('div'); name.className = 'name'; name.textContent = p.title;
    const pct = document.createElement('div'); pct.className = 'pct';
    pct.textContent = layersFor(p).length ? `${Math.round(layersFor(p)[0].percent)}% used` : '—';
    cell.append(cv, name, pct);
    grid.appendChild(cell);
  });
}

// ===== panel: daily burn (stacked per provider) =====
{
  const chart = document.getElementById('burnChart');
  const days = [2.1, 3.4, 1.2, 4.8, 2.9, 5.5, 3.2, 2.4, 4.1, 3.8, 6.2, 2.8, 3.6, 4.4].map(t => ({ total: t }));
  const max = Math.max(...days.map(d => d.total));
  days.forEach(d => {
    const day = document.createElement('div');
    day.className = 'day';
    const seg = document.createElement('div');
    seg.style.height = `${(d.total / max) * 100}%`;
    seg.style.background = '#D97757';
    day.appendChild(seg);
    chart.appendChild(day);
  });
}

// ===== attention states =====
drawRing(document.getElementById('warnRing'), layersFor(providers[0]), PALETTE.claude, 28, '#e8e8ec');
drawRing(document.getElementById('critRing'), [{ percent: 97, pacePercent: 50 }], PALETTE.dim, 28, '#e8e8ec');
drawRing(document.getElementById('emptyRing'), [], PALETTE.dim, 28, '#e8e8ec');
</script>
</body>
</html>
