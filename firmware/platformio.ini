; Waveshare ESP32-S3 AMOLED — headroom display
; 1.8" (default):  pio run -e esp32-s3-18 -t upload
; 2.16" square:    pio run -e esp32-s3-216 -t upload
; 1.75" round:     pio run -e esp32-s3-175-round -t upload
[env:esp32-s3-18]
; pioarduino fork — ships arduino-esp32 3.x (core 2.x lacks esp32-hal-periman.h,
; which Arduino_GFX + this SH8601 AMOLED board require).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Stamps FW_BUILD/FW_VERSION into every binary — see version.py.
extra_scripts = pre:version.py
; ESP32-S3R8: 8MB OPI PSRAM (needed for the landscape software-rotate canvas)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    bblanchon/ArduinoJson@^7.2.0
    lewisxhe/XPowersLib@^0.2.7

; Waveshare ESP32-S3-Touch-AMOLED-2.16 — 480×480 CO5300, CST9220 touch.
; No TCA9554; LCD/TP resets are direct GPIOs. Panel is mounted 90° CW from
; its native scan, corrected with MADCTL 0xA0 after begin().
[env:esp32-s3-216]
extends = env:esp32-s3-18
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_WS_AMOLED_216=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    bblanchon/ArduinoJson@^7.2.0
    lewisxhe/XPowersLib@^0.2.7
    lewisxhe/SensorLib@^0.4.1

; Waveshare ESP32-S3-Touch-AMOLED-1.75 — round 466×466 CO5300,
; CST9217 touch. Hardware values and orientation are shared with the proven
; esp32-lofiair `amoled-175c` target; the UI is Headroom's circular layout.
[env:esp32-s3-175-round]
extends = env:esp32-s3-18
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_WS_AMOLED_175_ROUND=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    bblanchon/ArduinoJson@^7.2.0
    lewisxhe/XPowersLib@^0.2.7
