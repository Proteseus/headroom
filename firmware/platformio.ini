; Waveshare ESP32-S3 1.8" — headroom display
; Build/flash:  pio run -t upload && pio device monitor
[env:esp32-s3]
; pioarduino fork — ships arduino-esp32 3.x (core 2.x lacks esp32-hal-periman.h,
; which Arduino_GFX + this SH8601 AMOLED board require).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3R8: 8MB OPI PSRAM (needed for the landscape software-rotate canvas)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    bblanchon/ArduinoJson@^7.2.0
    lewisxhe/XPowersLib@^0.2.7
